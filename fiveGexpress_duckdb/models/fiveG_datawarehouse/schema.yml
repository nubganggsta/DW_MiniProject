version: 2

models:
  # ==================================================================
  # DIMENSION TABLES (มีไฟล์จริง 4 ตาราง)
  # ==================================================================
  - name: dim_date
    description: "ตารางมิติมิติเวลา (Master Date Dimension)"
    columns:
      - name: date_key
        tests:
          - unique
          - not_null

  - name: dim_drivers
    description: "ตารางมิติประวัติพนักงานขับรถ"
    columns:
      - name: driver_sk
        tests:
          - unique
          - not_null
      - name: driver_id
        tests:
          - unique
          - not_null

  - name: dim_facilities
    description: "ตารางมิติสถานที่และคลังสินค้า"
    columns:
      - name: facility_sk
        tests:
          - unique
          - not_null
      - name: facility_id
        tests:
          - unique
          - not_null

  - name: dim_route
    description: "ตารางมิติเส้นทาง"
    columns:
      - name: route_id
        tests:
          - unique
          - not_null

  - name: dim_customers
    description: "ตารางมิติข้อมูลลูกค้า"
    columns:
      - name: Customer_Key
        tests:
          - unique
          - not_null
      - name: Customer_ID
        tests:
          - unique
          - not_null
      - name: Customer_Name
        tests:
          - not_null
      - name: Status
        tests:
          - not_null

  - name: dim_trucks
    description: "ตารางมิติข้อมูลรถบรรทุก"
    columns:
      - name: truck_sk
        tests:
          - unique
          - not_null
      - name: truck_id
        tests:
          - unique
          - not_null
      - name: status
        tests:
          - not_null

  # ==================================================================
  # FACT TABLES (มีไฟล์จริง 3 ตาราง)
  # ==================================================================
  - name: fct_fuel
    description: "Fact Table บันทึกการเติมน้ำมัน"
    columns:
      - name: fuel_key
        tests:
          - unique
          - not_null
      - name: total_cost
        tests:
          - not_null
      - name: date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: driver_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_drivers')
                field: driver_sk

  - name: fct_maintenance
    description: "Fact Table บันทึกการซ่อมบำรุง"
    columns:
      - name: maintenance_id
        tests:
          - unique
          - not_null
      - name: total_cost
        tests:
          - not_null

  - name: fct_safety_incidents
    description: "Fact Table บันทึกอุบัติเหตุ"
    columns:
      - name: safety_incident_key
        tests:
          - unique
          - not_null
      - name: incident_cost
        tests:
          - not_null
      - name: date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: driver_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_drivers')
                field: driver_sk