version: 2

models:
  # ==========================================
  # 1. DIMENSION TABLES
  # ==========================================
  - name: dim_date
    description: "ตารางมิติเวลา (Date Dimension) สำหรับจัดกลุ่มรายปี ไตรมาส เดือน และวัน"
    columns:
      - name: date_key
        tests:
          - unique
          - not_null

  - name: dim_customers
    description: "ตารางมิติข้อมูลลูกค้าและประเภทสินค้าหลัก (Primary Freight Type)"
    columns:
      - name: customer_key
        tests:
          - unique
          - not_null

  - name: dim_trucks
    description: "ตารางมิติข้อมูลรถบรรทุก"
    columns:
      - name: truck_key
        tests:
          - unique
          - not_null

  - name: dim_trailers
    description: "ตารางมิติข้อมูลหางลาก (เช่น ตู้เย็น, ตู้แห้ง)"
    columns:
      - name: trailer_key
        tests:
          - unique
          - not_null

  - name: dim_drivers
    description: "ตารางมิติข้อมูลพนักงานขับรถ"
    columns:
      - name: driver_key
        tests:
          - unique
          - not_null

  - name: dim_routes
    description: "ตารางมิติเส้นทางขนส่ง (ต้นทาง-ปลายทาง และระยะทางมาตรฐาน)"
    columns:
      - name: route_key
        tests:
          - unique
          - not_null

  - name: dim_facilities
    description: "ตารางมิติศูนย์กระจายสินค้าและจุดแวะพัก"
    columns:
      - name: facility_key
        tests:
          - unique
          - not_null


  # ==========================================
  # 2. FACT TABLES
  # ==========================================
  - name: fact_trips_operations
    description: "Fact Table บันทึกข้อมูลการวิ่งเที่ยวรถ โหลดสินค้า รายได้ และตัวชี้วัดปฏิบัติการ"
    columns:
      - name: trip_key
        tests:
          - unique
          - not_null
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: driver_key
        tests:
          - relationships:
              to: ref('dim_drivers')
              field: driver_key
      - name: truck_key
        tests:
          - relationships:
              to: ref('dim_trucks')
              field: truck_key
      - name: customer_key
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_key
      - name: trailer_key
        tests:
          - relationships:
              to: ref('dim_trailers')
              field: trailer_key
      - name: facility_key
        tests:
          - relationships:
              to: ref('dim_facilities')
              field: facility_key

  - name: fact_fuel
    description: "Fact Table บันทึกต้นทุนการเติมน้ำมันและปริมาณแกลลอน"
    columns:
      - name: fuel_key
        tests:
          - unique
          - not_null
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: truck_key
        tests:
          - relationships:
              to: ref('dim_trucks')
              field: truck_key
      - name: route_key
        tests:
          - relationships:
              to: ref('dim_routes')
              field: route_key

  - name: fact_maintenance
    description: "Fact Table บันทึกค่าใช้จ่ายในการซ่อมบำรุงและเวลาจอดรถเสีย (Downtime)"
    columns:
      - name: maintenance_key
        tests:
          - unique
          - not_null
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: truck_key
        tests:
          - relationships:
              to: ref('dim_trucks')
              field: truck_key

  - name: fact_safety_incidents
    description: "Fact Table บันทึกสถิติอุบัติเหตุและความปลอดภัยในการขนส่ง"
    columns:
      - name: incident_key
        tests:
          - unique
          - not_null
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: route_key
        tests:
          - relationships:
              to: ref('dim_routes')
              field: route_key
      - name: truck_key
        tests:
          - relationships:
              to: ref('dim_trucks')
              field: truck_key
      - name: driver_key
        tests:
          - relationships:
              to: ref('dim_drivers')
              field: driver_key