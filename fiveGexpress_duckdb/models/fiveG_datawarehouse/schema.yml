version: 2

models:
  # ==================================================================
  # DIMENSION TABLES
  # ==================================================================
  - name: dim_date
    description: "ตารางมิติมิติเวลา (Master Date Dimension)"
    columns:
      - name: date_key
        tests:
          - unique
          - not_null

  - name: dim_drivers
    description: "ตารางมิติประวัติพนักงานขับรถ"
    columns:
      - name: driver_key
        tests:
          - unique
          - not_null
      - name: driver_id
        tests:
          - unique
          - not_null

  - name: dim_facilities
    description: "ตารางมิติสถานที่และคลังสินค้า"
    columns:
      - name: facility_key
        tests:
          - unique
          - not_null
      - name: facility_id
        tests:
          - unique
          - not_null

  - name: dim_route
    description: "ตารางมิติเส้นทาง"
    columns:
      - name: route_key
        tests:
          - unique
          - not_null
      - name: route_id
        tests:
          - unique
          - not_null

  - name: dim_customers
    description: "ตารางมิติข้อมูลลูกค้า"
    columns:
      - name: customer_key
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_name
        tests:
          - not_null
      - name: Status
        tests:
          - not_null

  - name: dim_trucks
    description: "ตารางมิติข้อมูลรถบรรทุก"
    columns:
      - name: truck_key
        tests:
          - unique
          - not_null
      - name: Truck_ID
        tests:
          - unique
          - not_null
      - name: Status
        tests:
          - not_null

  # ==================================================================
  # FACT TABLES
  # ==================================================================
  - name: fact_fuel
    description: "Fact Table บันทึกการเติมน้ำมัน"
    columns:
      - name: fuel_key
        tests:
          - unique
          - not_null
      - name: total_cost
        tests:
          - not_null
      - name: date_key
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: driver_key
        tests:
          - relationships:
              to: ref('dim_drivers')
              field: driver_key
      - name: truck_key
        tests:
          - relationships:
              to: ref('dim_trucks')
              field: truck_key

  - name: fact_maintenance
    description: "Fact Table บันทึกการซ่อมบำรุง"
    columns:
      - name: maintenance_id
        tests:
          - unique
          - not_null
      - name: total_cost
        tests:
          - not_null
      - name: date_key
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: truck_key
        tests:
          - relationships:
              to: ref('dim_trucks')
              field: truck_key

  - name: fact_safety_incidents
    description: "Fact Table บันทึกอุบัติเหตุและความปลอดภัย"
    columns:
      - name: safety_incident_key
        tests:
          - unique
          - not_null
      - name: incident_cost
        tests:
          - not_null
      - name: date_key
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: driver_key
        tests:
          - relationships:
              to: ref('dim_drivers')
              field: driver_key
      - name: truck_key
        tests:
          - relationships:
              to: ref('dim_trucks')
              field: truck_key

  - name: fact_delivery
    description: "Fact Table บันทึกเหตุการณ์การจัดส่งสินค้า (Delivery Events)"
    columns:
      - name: delivery_event_key
        tests:
          - unique
          - not_null
      - name: date_key
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: customer_key
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_key
      - name: driver_key
        tests:
          - relationships:
              to: ref('dim_drivers')
              field: driver_key
      - name: truck_key
        tests:
          - relationships:
              to: ref('dim_trucks')
              field: truck_key
      - name: facility_key
        tests:
          - relationships:
              to: ref('dim_facilities')
              field: facility_key

  - name: fact_loads
    description: "Fact Table บันทึกข้อมูลเที่ยวโหลดสินค้าและรายได้"
    columns:
      - name: load_key
        tests:
          - unique
          - not_null
      - name: date_key
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: customer_key
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_key
      - name: route_key
        tests:
          - relationships:
              to: ref('dim_route')
              field: route_key

  - name: fact_trips
    description: "Fact Table บันทึกข้อมูลการวิ่งเที่ยวรถและระยะทาง"
    columns:
      - name: trip_key
        tests:
          - unique
          - not_null
      - name: date_key
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: driver_key
        tests:
          - relationships:
              to: ref('dim_drivers')
              field: driver_key
      - name: truck_key
        tests:
          - relationships:
              to: ref('dim_trucks')
              field: truck_key
      - name: customer_key
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_key